# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Check Content Security Policies
        run: |
          python3 scripts/ensure-journal-csp.py
          python3 scripts/check-csp.py
      - name: Check book catalogue and generated pages
        run: |
          node scripts/sync-books.mjs --check
          node scripts/generate-product-pages.mjs --check
          node scripts/generate-serial.mjs --check
          node --test tests/*.test.mjs
      - name: Prepare public site
        run: |
          mkdir -p _site
          rsync -a --exclude='.*' --exclude='_site/' --exclude='scripts/' --exclude='tests/' --exclude='*.md' --exclude='*.mjs' --exclude='*.py' --exclude='journal-export.json' ./ _site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
