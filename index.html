    <script>
      const ecwidDarkScheme = window.matchMedia('(prefers-color-scheme: dark)');
      const ecwidPalettes = {
        light: {
          'color-background': '#ffffff',
          'color-foreground': '#111111',
          'color-link': '#111111',
          'color-button': '#111111',
          'color-price': '#111111'
        },
        dark: {
          'color-background': '#10100f',
          'color-foreground': '#eeeeea',
          'color-link': '#eeeeea',
          'color-button': '#eeeeea',
          'color-price': '#eeeeea'
        }
      };
      let ecwidPaletteMode = ecwidDarkScheme.matches ? 'dark' : 'light';
      let ecwidCheckoutNeedsLightPalette = false;

      const updateEcwidDarkModePalette = (useLightCheckout = ecwidCheckoutNeedsLightPalette) => {
        ecwidCheckoutNeedsLightPalette = useLightCheckout;
        const nextMode = ecwidDarkScheme.matches && !useLightCheckout ? 'dark' : 'light';
        document.body.classList.toggle('ecwid-light-checkout', ecwidDarkScheme.matches && useLightCheckout);
        if (nextMode === ecwidPaletteMode) return;

        ecwidPaletteMode = nextMode;
        window.ec = window.ec || {};
        window.ec.config = window.ec.config || {};
        window.ec.config.chameleon = window.ec.config.chameleon || {};
        window.ec.config.chameleon.colors = ecwidPalettes[nextMode];
        window.Ecwid?.refreshConfig?.();
      };

      window.ec = window.ec || {};
      window.ec.config = window.ec.config || {};
      window.ec.config.chameleon = window.ec.config.chameleon || {};
      window.ec.config.chameleon.colors = ecwidPalettes[ecwidPaletteMode];
      ecwidDarkScheme.addEventListener('change', () => updateEcwidDarkModePalette());
    </script>
    <script data-cfasync="false" src="https://app.ecwid.com/script.js?139267004&amp;data_platform=code&amp;data_date=2026-07-24" charset="utf-8"></script>

    <script>
      Ecwid.OnAPILoaded.add(() => {
        Ecwid.OnPageLoaded.add((page) => {
          updateEcwidDarkModePalette(page.type === 'CHECKOUT_PAYMENT_DETAILS');
        });
      });

      Ecwid.init();

        "defaultCategoryId=203498829",
        "id=my-store-139267004"
      );

      const catalogNavigation = document.querySelector('[data-books-catalog-navigation]');

      const updateCatalogNavigation = () => {
        if (!catalogNavigation) return;
        catalogNavigation.hidden = !/\/p\/\d+/.test(window.location.hash);
      };

      window.addEventListener('hashchange', updateCatalogNavigation);
      updateCatalogNavigation();
    </script>
